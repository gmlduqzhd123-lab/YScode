    <script>
        // --- 1. Theme (Dark/Light Mode) Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function storageGet(key) {
            try { return localStorage.getItem(key); } catch (e) { return null; }
        }
        function storageSet(key, value) {
            try { localStorage.setItem(key, value); } catch (e) { /* 저장 불가 환경은 무시 */ }
        }

        function initTheme() {
            const saved = storageGet('color-theme');
            if (saved === 'dark' || (!saved && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
            }
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                storageSet('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                storageSet('color-theme', 'dark');
            }
        });

        initTheme();

        // --- 2. Admin Mode (주소 끝에 ?admin 을 붙이면 앱 추가/삭제 가능) ---
        const IS_ADMIN = new URLSearchParams(location.search).has('admin');
        if (IS_ADMIN) {
            document.querySelectorAll('.admin-only').forEach(el => {
                el.classList.remove('hidden');
                el.classList.add('flex');
            });
        }

        // --- 3. Modal Logic ---
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            const form = document.getElementById('add-app-form');

            if (modal.classList.contains('active')) {
                modal.classList.remove('active');
                document.body.classList.remove('modal-open');
                setTimeout(() => {
                    form.reset();
                    document.getElementById('url-error').classList.add('hidden');
                }, 300);
            } else {
                modal.classList.add('active');
                document.body.classList.add('modal-open');
                setTimeout(() => document.getElementById('appName').focus(), 50);
            }
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const activeModal = document.querySelector('.modal-overlay.active');
                if (activeModal) toggleModal(activeModal.id);
            }
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('mousedown', (e) => {
                if (e.target === overlay) toggleModal(overlay.id);
            });
        });

                name: '엽쌤스쿨 홈페이지',
                category: '기타',
                icon: '🏫',
                desc: '엽쌤스쿨 | 경계를 넘어서는 교육. 수업 자료, 연구대회 포트폴리오, 블로그',
                url: 'https://ysschool.vercel.app/'
            }
        ];

        // 관리자 모드에서 추가한 앱 (이 브라우저에만 저장)
        const STORAGE_KEY = 'YEOP_VIBE_MY_APPS';
        let myApps = [];
        let currentFilter = '전체';

        const CATEGORIES = ['업무용', '수업용', '운영용', '학생용', '유틸리티', '기타'];
        const categoryStyles = {
            '업무용': { bg: 'bg-blue-100 dark:bg-blue-900/40', text: 'text-blue-700 dark:text-blue-300' },
            '수업용': { bg: 'bg-emerald-100 dark:bg-emerald-900/40', text: 'text-emerald-700 dark:text-emerald-300' },
            '운영용': { bg: 'bg-purple-100 dark:bg-purple-900/40', text: 'text-purple-700 dark:text-purple-300' },
            '학생용': { bg: 'bg-amber-100 dark:bg-amber-900/40', text: 'text-amber-700 dark:text-amber-300' },
            '유틸리티': { bg: 'bg-rose-100 dark:bg-rose-900/40', text: 'text-rose-700 dark:text-rose-300' },
            '기타': { bg: 'bg-slate-200 dark:bg-slate-700', text: 'text-slate-700 dark:text-slate-300' },
        };

        function isSafeUrl(url) {
            try {
                const u = new URL(url);
                return u.protocol === 'https:' || u.protocol === 'http:';
            } catch (e) {
                return false;
            }
        }

        // 🏊‍♂️ 같은 합성 이모지도 한 글자로 취급해 첫 글자만 사용
        function firstGrapheme(text) {
            if (window.Intl && Intl.Segmenter) {
                const seg = new Intl.Segmenter('ko', { granularity: 'grapheme' }).segment(text)[Symbol.iterator]().next();
                return seg.done ? '' : seg.value.segment;
            }
            return Array.from(text)[0] || '';
        }

        function loadMyApps() {
            if (!IS_ADMIN) return;
            try {
                const parsed = JSON.parse(storageGet(STORAGE_KEY) || '[]');
                myApps = Array.isArray(parsed)
                    ? parsed.filter(a => a && typeof a.name === 'string' && isSafeUrl(a.url))
                    : [];
            } catch (e) {
                myApps = [];
            }
        }

        function saveMyApps() {
            storageSet(STORAGE_KEY, JSON.stringify(myApps));
        }

        function allApps() {
            return [
                ...PUBLISHED_APPS.map(a => ({ ...a, local: false })),
                ...myApps.map(a => ({ ...a, local: true }))
            ];
        }

        // --- 5. Rendering ---
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text !== undefined) node.textContent = text;
            return node;
        }

        function renderFilters() {
            const bar = document.getElementById('filter-bar');
            const apps = allApps();
            const used = CATEGORIES.filter(c => apps.some(a => a.category === c));
            if (!used.includes(currentFilter)) currentFilter = '전체';
            bar.innerHTML = '';

            ['전체', ...used].forEach(cat => {
                const count = cat === '전체' ? apps.length : apps.filter(a => a.category === cat).length;
                const active = cat === currentFilter;
                const btn = el('button',
                    'shrink-0 px-4 py-2 rounded-full text-sm font-semibold border transition-colors ' +
                    (active
                        ? 'bg-vibe-600 border-vibe-600 text-white'
                        : 'bg-white dark:bg-slate-800 border-slate-200 dark:border-slate-700 text-slate-600 dark:text-slate-300 hover:border-vibe-500'),
                    `${cat} ${count}`);
                btn.type = 'button';
                btn.setAttribute('aria-pressed', String(active));
                btn.addEventListener('click', () => {
                    currentFilter = cat;
                    render();
                });
                bar.appendChild(btn);
            });
        }

        function createCard(app) {
            const style = categoryStyles[app.category] || categoryStyles['기타'];
            const card = el('div', 'bento-card relative group bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col h-full');

            if (IS_ADMIN && app.local) {
                const del = el('button', 'absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-red-100 text-red-600 hover:bg-red-200 dark:bg-red-900/50 dark:text-red-300 dark:hover:bg-red-900');
                del.type = 'button';
                del.title = '앱 삭제';
                del.setAttribute('aria-label', `${app.name} 삭제`);
                del.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>';
                del.addEventListener('click', (e) => deleteApp(app.id, app.name, e));
                card.appendChild(del);
            }

            const link = el('a', 'flex-grow flex flex-col cursor-pointer outline-none focus-visible:ring-2 focus-visible:ring-vibe-500 rounded-2xl');
            link.href = app.url;
            link.target = '_blank';
            link.rel = 'noopener noreferrer';

            const iconRow = el('div', 'flex items-start justify-between mb-4');
            iconRow.appendChild(el('div', 'w-14 h-14 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 flex items-center justify-center text-3xl shadow-sm group-hover:scale-110 transition-transform duration-300', app.icon));
            link.appendChild(iconRow);

            link.appendChild(el('h4', 'text-xl font-bold mb-2 text-slate-800 dark:text-white group-hover:text-vibe-600 dark:group-hover:text-vibe-400 transition-colors line-clamp-1', app.name));
            link.appendChild(el('p', 'text-slate-500 dark:text-slate-400 text-sm mb-4 line-clamp-2 flex-grow', app.desc));

            const footer = el('div', 'mt-auto pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between');
            const tags = el('div', 'flex items-center gap-2');
            tags.appendChild(el('span', `px-3 py-1 text-xs font-bold rounded-full ${style.bg} ${style.text}`, app.category));
            if (app.local) {
                tags.appendChild(el('span', 'px-2 py-1 text-xs font-semibold rounded-full bg-slate-100 dark:bg-slate-700 text-slate-500 dark:text-slate-400', '내 브라우저'));
            }
            footer.appendChild(tags);
            const arrow = el('span', 'text-slate-300 dark:text-slate-600 group-hover:text-vibe-500 transition-colors');
            arrow.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>';
            footer.appendChild(arrow);
            link.appendChild(footer);

            card.appendChild(link);
            return card;
        }

        function renderApps() {
            const grid = document.getElementById('apps-grid');
            const emptyState = document.getElementById('empty-state');
            const apps = allApps().filter(a => currentFilter === '전체' || a.category === currentFilter);

            grid.innerHTML = '';

            if (apps.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                emptyState.classList.add('flex');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');
            emptyState.classList.remove('flex');
            apps.forEach(app => grid.appendChild(createCard(app)));
        }

        function render() {
            renderFilters();
            renderApps();
        }

        // --- 6. Form Submission (Add App) ---
        function handleFormSubmit(event) {
            event.preventDefault();
            if (!IS_ADMIN) return;

            const name = document.getElementById('appName').value.trim();
            const url = document.getElementById('appUrl').value.trim();
            const icon = firstGrapheme(document.getElementById('appIcon').value.trim()) || '🚀';
            const category = document.getElementById('appCategory').value;
            const desc = document.getElementById('appDesc').value.trim();
            const urlError = document.getElementById('url-error');

            if (!name || !url || !desc) return;
            if (!isSafeUrl(url)) {
                urlError.classList.remove('hidden');
                return;
            }
            urlError.classList.add('hidden');

            myApps.push({
                id: 'my-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
                name, url, icon,
                category: CATEGORIES.includes(category) ? category : '기타',
                desc
            });
            saveMyApps();
            render();
            toggleModal('add-app-modal');
        }

        // --- 7. Delete App Logic ---
        function deleteApp(id, name, event) {
            event.preventDefault();
            event.stopPropagation();
            if (!confirm(`'${name}' 앱을 삭제할까요?\n삭제하면 되돌릴 수 없어요.`)) return;
            myApps = myApps.filter(app => app.id !== id);
            saveMyApps();
            render();
        }

        // --- Initialize App ---
        document.addEventListener('DOMContentLoaded', () => {
            loadMyApps();
            render();
        });
    </script>
</body>
</html>
