<!DOCTYPE html>
<html lang="ko" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>엽쌤의 바이브 코딩 교실</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.8/dist/web/static/pretendard.css" />
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: { sans: ['Pretendard', 'sans-serif'] },
                    colors: {
                        vibe: { 50: '#f0fdfa', 100: '#ccfbf1', 500: '#14b8a6', 600: '#0d9488', 900: '#134e4a' }
                    }
                }
            }
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .bento-card {
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .bento-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .dark .bento-card:hover {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
        }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .dark ::-webkit-scrollbar-thumb { background: #475569; }
        
        /* Modal Animation */
        .modal-open { overflow: hidden; }
        .modal-overlay {
            transition: opacity 0.3s ease-out;
            opacity: 0; pointer-events: none;
        }
        .modal-overlay.active {
            opacity: 1; pointer-events: auto;
        }
        .modal-content {
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease-out;
            transform: scale(0.95) translateY(10px); opacity: 0;
        }
        .modal-overlay.active .modal-content {
            transform: scale(1) translateY(0); opacity: 1;
        }
    </style>
</head>
<body class="bg-slate-100 dark:bg-slate-900 text-slate-800 dark:text-slate-100 transition-colors duration-300 min-h-screen flex flex-col">

    <header class="sticky top-0 z-40 backdrop-blur-md bg-white/70 dark:bg-slate-900/80 border-b border-slate-200 dark:border-slate-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center gap-2">
                <span class="text-2xl">✨</span>
                <h1 class="text-xl md:text-2xl font-bold bg-clip-text text-transparent bg-gradient-to-r from-vibe-600 to-blue-600 dark:from-vibe-500 dark:to-blue-400">
                    엽쌤의 바이브 코딩
                </h1>
            </div>

            <div class="flex items-center gap-2 md:gap-4">
                <!-- Add App Button -->
                <button onclick="toggleModal('add-app-modal')" class="flex items-center gap-1.5 md:gap-2 px-3 py-1.5 md:px-4 md:py-2 rounded-full bg-vibe-500 hover:bg-vibe-600 text-white transition-colors text-sm font-semibold shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14"/><path d="M12 5v14"/></svg>
                    <span class="hidden md:inline">앱 추가하기</span>
                </button>

                <!-- Theme Toggle -->
                <button id="theme-toggle" class="p-2 rounded-full bg-slate-200 hover:bg-slate-300 dark:bg-slate-800 dark:hover:bg-slate-700 transition-colors" aria-label="Toggle Dark Mode">
                    <svg id="theme-toggle-light-icon" class="hidden w-5 h-5 text-yellow-500" fill="currentColor" viewBox="0 0 20 20"><path d="M10 2a1 1 0 011 1v1a1 1 0 11-2 0V3a1 1 0 011-1zm4 8a4 4 0 11-8 0 4 4 0 018 0zm-.464 4.95l.707.707a1 1 0 001.414-1.414l-.707-.707a1 1 0 00-1.414 1.414zm2.12-10.607a1 1 0 010 1.414l-.706.707a1 1 0 11-1.414-1.414l.707-.707a1 1 0 011.414 0zM17 11a1 1 0 100-2h-1a1 1 0 100 2h1zm-7 4a1 1 0 011 1v1a1 1 0 11-2 0v-1a1 1 0 011-1zM5.05 6.464A1 1 0 106.465 5.05l-.708-.707a1 1 0 00-1.414 1.414l.707.707zm1.414 8.486l-.707.707a1 1 0 01-1.414-1.414l.707-.707a1 1 0 011.414 1.414zM4 11a1 1 0 100-2H3a1 1 0 000 2h1z" fill-rule="evenodd" clip-rule="evenodd"></path></svg>
                    <svg id="theme-toggle-dark-icon" class="hidden w-5 h-5 text-slate-700" fill="currentColor" viewBox="0 0 20 20"><path d="M17.293 13.293A8 8 0 016.707 2.707a8.001 8.001 0 1010.586 10.586z"></path></svg>
                </button>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <!-- Hero Section -->
        <div class="mb-10 bento-card bg-slate-900 dark:bg-slate-800 rounded-3xl p-8 md:p-10 text-white shadow-xl relative overflow-hidden border border-slate-700">
            <div class="relative z-10">
                <h2 class="text-3xl md:text-4xl font-black mb-3 tracking-tight">나만의 웹앱 대시보드 🚀</h2>
                <p class="text-slate-300 text-sm md:text-base max-w-2xl font-medium mb-4">선생님이 직접 만든 웹앱 링크를 추가하고 한곳에서 관리하세요. 브라우저에 안전하게 저장됩니다.</p>
                <button onclick="toggleModal('add-app-modal')" class="px-5 py-2.5 bg-white text-slate-900 font-bold rounded-xl hover:bg-slate-100 transition-colors inline-flex items-center gap-2 text-sm">
                    새로운 앱 등록하기
                </button>
            </div>
            <!-- Decorative Shapes -->
            <div class="absolute top-0 right-0 -mr-16 -mt-16 w-64 h-64 rounded-full bg-vibe-500 opacity-20 blur-3xl pointer-events-none"></div>
            <div class="absolute bottom-0 right-32 -mb-16 w-48 h-48 rounded-full bg-blue-500 opacity-20 blur-2xl pointer-events-none"></div>
        </div>

        <!-- Dynamic Apps Grid -->
        <div id="apps-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <!-- App cards will be injected here via JavaScript -->
        </div>

        <!-- Empty State (Hidden by default) -->
        <div id="empty-state" class="hidden flex flex-col items-center justify-center py-20 text-center">
            <div class="text-6xl mb-4 opacity-50">📭</div>
            <h3 class="text-xl font-bold mb-2 text-slate-700 dark:text-slate-300">등록된 앱이 없습니다</h3>
            <p class="text-slate-500 dark:text-slate-400">우측 상단의 '앱 추가하기' 버튼을 눌러 나만의 앱을 등록해보세요!</p>
        </div>
    </main>

    <!-- Add App Modal -->
    <div id="add-app-modal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-slate-900/50 backdrop-blur-sm px-4">
        <div class="modal-content bg-white dark:bg-slate-800 rounded-3xl shadow-2xl w-full max-w-md overflow-hidden border border-slate-200 dark:border-slate-700 relative">
            
            <!-- Modal Header -->
            <div class="flex items-center justify-between p-6 border-b border-slate-100 dark:border-slate-700">
                <h3 class="text-xl font-bold text-slate-800 dark:text-white flex items-center gap-2">
                    <span>✨</span> 새 웹앱 추가
                </h3>
                <button type="button" onclick="toggleModal('add-app-modal')" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-full hover:bg-slate-100 dark:hover:bg-slate-700 transition-colors">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
                </button>
            </div>

            <!-- Modal Body (Form) -->
            <form id="add-app-form" onsubmit="handleFormSubmit(event)" class="p-6 flex flex-col gap-4">
                
                <div class="flex gap-4">
                    <!-- Icon Input -->
                    <div class="w-1/4">
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">아이콘</label>
                        <input type="text" id="appIcon" placeholder="🚀" required maxlength="2" value="🚀" class="w-full text-center text-2xl px-3 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-vibe-500 focus:outline-none transition-all dark:text-white">
                    </div>
                    <!-- Name Input -->
                    <div class="w-3/4">
                        <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">앱 이름</label>
                        <input type="text" id="appName" placeholder="예: 랜덤 조퇴 사유 뽑기" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-vibe-500 focus:outline-none transition-all dark:text-white">
                    </div>
                </div>

                <!-- URL Input -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">연결할 URL (주소)</label>
                    <input type="url" id="appUrl" placeholder="https://..." required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-vibe-500 focus:outline-none transition-all dark:text-white">
                </div>

                <!-- Category Select -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">카테고리</label>
                    <select id="appCategory" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-vibe-500 focus:outline-none transition-all dark:text-white cursor-pointer appearance-none">
                        <option value="업무용">업무용 👨‍💻</option>
                        <option value="수업용">수업용 🎓</option>
                        <option value="운영용">운영용 ⚙️</option>
                        <option value="학생용">학생용 🏃</option>
                        <option value="유틸리티">유틸리티 🛠️</option>
                        <option value="기타">기타 📌</option>
                    </select>
                </div>

                <!-- Description Input -->
                <div>
                    <label class="block text-sm font-semibold text-slate-700 dark:text-slate-300 mb-1">간단한 설명</label>
                    <textarea id="appDesc" rows="2" placeholder="어떤 목적으로 사용하는 앱인가요?" required class="w-full px-4 py-2.5 bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-600 rounded-xl focus:ring-2 focus:ring-vibe-500 focus:outline-none transition-all resize-none dark:text-white"></textarea>
                </div>

                <!-- Form Actions -->
                <div class="mt-4 flex gap-3">
                    <button type="button" onclick="toggleModal('add-app-modal')" class="flex-1 py-3 bg-slate-100 hover:bg-slate-200 dark:bg-slate-700 dark:hover:bg-slate-600 text-slate-700 dark:text-slate-200 font-bold rounded-xl transition-colors">
                        취소
                    </button>
                    <button type="submit" class="flex-1 py-3 bg-vibe-500 hover:bg-vibe-600 text-white font-bold rounded-xl transition-colors shadow-md shadow-vibe-500/20">
                        추가하기
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="mt-auto border-t border-slate-200 dark:border-slate-800 bg-white/50 dark:bg-slate-950/50 py-8">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 dark:text-slate-400 font-medium flex items-center justify-center gap-2">
                <span>Made by.</span> 
                <span class="font-bold text-slate-800 dark:text-slate-200">엽쌤</span> 
                <span class="text-xl">😎</span>
            </p>
            <p class="text-xs text-slate-400 dark:text-slate-500 mt-2">Vibe Coding - No Code, Just Vibe.</p>
        </div>
    </footer>

    <script>
        // --- 1. Theme (Dark/Light Mode) Logic ---
        const themeToggleBtn = document.getElementById('theme-toggle');
        const darkIcon = document.getElementById('theme-toggle-dark-icon');
        const lightIcon = document.getElementById('theme-toggle-light-icon');

        function initTheme() {
            if (localStorage.getItem('color-theme') === 'dark' || (!('color-theme' in localStorage) && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                document.documentElement.classList.add('dark');
                lightIcon.classList.remove('hidden');
            } else {
                document.documentElement.classList.remove('dark');
                darkIcon.classList.remove('hidden');
            }
        }

        themeToggleBtn.addEventListener('click', function() {
            darkIcon.classList.toggle('hidden');
            lightIcon.classList.toggle('hidden');
            if (document.documentElement.classList.contains('dark')) {
                document.documentElement.classList.remove('dark');
                localStorage.setItem('color-theme', 'light');
            } else {
                document.documentElement.classList.add('dark');
                localStorage.setItem('color-theme', 'dark');
            }
        });

        initTheme();

        // --- 2. Modal Logic ---
        function toggleModal(modalID) {
            const modal = document.getElementById(modalID);
            const form = document.getElementById('add-app-form');
            
            if (modal.classList.contains('active')) {
                // Close modal
                modal.classList.remove('active');
                document.body.classList.remove('modal-open');
                setTimeout(() => form.reset(), 300); // Reset form after animation
            } else {
                // Open modal
                modal.classList.add('active');
                document.body.classList.add('modal-open');
            }
        }

        // Close modal on escape key or clicking outside
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                const activeModal = document.querySelector('.modal-overlay.active');
                if (activeModal) toggleModal(activeModal.id);
            }
        });
        document.querySelectorAll('.modal-overlay').forEach(overlay => {
            overlay.addEventListener('mousedown', (e) => {
                if (e.target === overlay) toggleModal(overlay.id);
            });
        });

        // --- 3. App Data Management ---
        const STORAGE_KEY = 'YEOP_VIBE_APPS_DATA';

        // Default apps requested by user
        const defaultApps = [
            {
                id: Date.now().toString() + "-1",
                name: "랜덤 조퇴 사유 뽑기",
                category: "업무용",
                icon: "🎲",
                desc: "재치있는 조퇴 사유 및 연수 주제 랜덤 뽑기",
                url: "https://example.com/random-leave"
            },
            {
                id: Date.now().toString() + "-2",
                name: "Hallyoswim 수영부 관리",
                category: "운영용",
                icon: "🏊‍♂️",
                desc: "여수한려초등학교 수영부 학생 및 대회 기록 관리",
                url: "https://example.com/hallyoswim"
            },
            {
                id: Date.now().toString() + "-3",
                name: "5~6학년 협동 체육 웹앱",
                category: "수업용",
                icon: "🏃‍♂️",
                desc: "체육 시간 활용을 위한 학생 참여형 협동 앱",
                url: "https://example.com/pe-coop"
            }
        ];

        let appsData = [];

        // Category Styles Mapping
        const categoryStyles = {
            '업무용': { bg: 'bg-blue-100 dark:bg-blue-900/40', text: 'text-blue-700 dark:text-blue-300' },
            '수업용': { bg: 'bg-emerald-100 dark:bg-emerald-900/40', text: 'text-emerald-700 dark:text-emerald-300' },
            '운영용': { bg: 'bg-purple-100 dark:bg-purple-900/40', text: 'text-purple-700 dark:text-purple-300' },
            '학생용': { bg: 'bg-amber-100 dark:bg-amber-900/40', text: 'text-amber-700 dark:text-amber-300' },
            '유틸리티': { bg: 'bg-rose-100 dark:bg-rose-900/40', text: 'text-rose-700 dark:text-rose-300' },
            '기타': { bg: 'bg-slate-200 dark:bg-slate-700', text: 'text-slate-700 dark:text-slate-300' },
        };

        function loadApps() {
            const stored = localStorage.getItem(STORAGE_KEY);
            if (stored) {
                appsData = JSON.parse(stored);
            } else {
                // Initial setup with default apps
                appsData = [...defaultApps];
                saveApps();
            }
            renderApps();
        }

        function saveApps() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(appsData));
        }

        // --- STREAMING_CHUNK:Rendering Engine... ---
        function renderApps() {
            const grid = document.getElementById('apps-grid');
            const emptyState = document.getElementById('empty-state');
            
            grid.innerHTML = '';

            if (appsData.length === 0) {
                grid.classList.add('hidden');
                emptyState.classList.remove('hidden');
                return;
            }

            grid.classList.remove('hidden');
            emptyState.classList.add('hidden');

            appsData.forEach(app => {
                const style = categoryStyles[app.category] || categoryStyles['기타'];
                
                // Create Card Element
                const card = document.createElement('div');
                card.className = "bento-card relative group bg-white dark:bg-slate-800 rounded-3xl p-6 border border-slate-200 dark:border-slate-700 shadow-sm flex flex-col h-full";
                
                card.innerHTML = `
                    <!-- Delete Button (Shown on hover) -->
                    <button onclick="deleteApp('${app.id}', event)" class="absolute top-4 right-4 z-10 w-8 h-8 flex items-center justify-center rounded-full bg-red-100 text-red-600 opacity-0 group-hover:opacity-100 transition-opacity hover:bg-red-200 dark:bg-red-900/50 dark:text-red-300 dark:hover:bg-red-900" title="앱 삭제">
                        <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"/><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"/><line x1="10" x2="10" y1="11" y2="17"/><line x1="14" x2="14" y1="11" y2="17"/></svg>
                    </button>

                    <a href="${app.url}" target="_blank" class="flex-grow flex flex-col cursor-pointer outline-none">
                        <div class="flex items-start justify-between mb-4">
                            <div class="w-14 h-14 rounded-2xl bg-slate-50 dark:bg-slate-900 border border-slate-100 dark:border-slate-700 flex items-center justify-center text-3xl shadow-sm group-hover:scale-110 transition-transform duration-300">
                                ${app.icon}
                            </div>
                        </div>
                        <h4 class="text-xl font-bold mb-2 text-slate-800 dark:text-white group-hover:text-vibe-600 dark:group-hover:text-vibe-400 transition-colors line-clamp-1">${app.name}</h4>
                        <p class="text-slate-500 dark:text-slate-400 text-sm mb-4 line-clamp-2 flex-grow">${app.desc}</p>
                        
                        <div class="mt-auto pt-4 border-t border-slate-100 dark:border-slate-700/50 flex items-center justify-between">
                            <span class="px-3 py-1 text-xs font-bold rounded-full ${style.bg} ${style.text}">
                                ${app.category}
                            </span>
                            <span class="text-slate-300 dark:text-slate-600 group-hover:text-vibe-500 transition-colors">
                                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h10v10"/><path d="M7 17 17 7"/></svg>
                            </span>
                        </div>
                    </a>
                `;
                grid.appendChild(card);
            });
        }

        // --- 4. Form Submission (Add App) ---
        function handleFormSubmit(event) {
            event.preventDefault(); // Prevent page reload

            const name = document.getElementById('appName').value.trim();
            const url = document.getElementById('appUrl').value.trim();
            const icon = document.getElementById('appIcon').value.trim() || '🚀';
            const category = document.getElementById('appCategory').value;
            const desc = document.getElementById('appDesc').value.trim();

            if (!name || !url || !desc) return;

            const newApp = {
                id: Date.now().toString(), // Simple unique ID
                name, url, icon, category, desc
            };

            // Add to array, save, and re-render
            appsData.push(newApp);
            saveApps();
            renderApps();
            toggleModal('add-app-modal'); // Close modal
        }

        // --- 5. Delete App Logic ---
        function deleteApp(id, event) {
            // Prevent the anchor tag from triggering
            event.preventDefault();
            event.stopPropagation();
            
            // Custom delete confirmation without using alert/confirm block
            // For smooth UX, we just delete it directly, or you could implement a custom toast.
            // Here we do a direct deletion for simplicity and speed.
            appsData = appsData.filter(app => app.id !== id);
            saveApps();
            renderApps();
        }

        // --- Initialize App ---
        window.onload = () => {
            loadApps();
        };

    </script>
</body>
</html>
